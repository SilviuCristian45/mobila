name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificări (format, lint, tipuri, arhitectură, licențe, teste, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versiunea pnpm vine din `packageManager` (pnpm@10.34.9)
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format (Prettier)
        run: pnpm format:check
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Tipuri (tsc strict)
        run: pnpm typecheck
      - name: Poartă arhitectură (dependency-cruiser)
        run: pnpm depcruise
      - name: Poartă licențe
        run: pnpm license:check
      - name: Teste unitare și teste ale porților
        run: pnpm test
      - name: Build static
        run: pnpm build

  e2e:
    name: E2E (${{ matrix.config }}) — Chromium, Firefox, WebKit
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        config: [radacina, basepath]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build + E2E la rădăcină
        if: matrix.config == 'radacina'
        run: pnpm build && pnpm e2e
      - name: E2E persistență (IndexedDB și Web Locks reale)
        if: matrix.config == 'radacina'
        run: pnpm e2e:storage
      - name: Build + E2E cu basePath (/rc-test)
        if: matrix.config == 'basepath'
        run: pnpm build:base && pnpm e2e:base
